name: Rate limiter benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Direct/gateway controls and sync/async limiters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: kong-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:compose.benchmark.yaml
    outputs:
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/benchmark-report"

      - name: Run serial benchmark comparison
        run: |
          ./run.sh benchmark-compare --vus 10 --duration 10 --warmup 2 --repeats 3 --keepalive \
            --kong-async-sync-rate 0.1 --redis-timeout-ms 1000 --output "$RUNNER_TEMP/benchmark-report" \
            2>&1 | tee "$RUNNER_TEMP/benchmark-report/runner.log"

      - name: Add report to job summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/benchmark-report/report.md"; then
            cat "$RUNNER_TEMP/benchmark-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark failed before a complete report was generated. See the artifacts and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect environment and diagnostics
        if: always()
        run: |
          docker compose config > "$RUNNER_TEMP/benchmark-report/compose.yaml" 2>&1 || true
          docker compose ps --all > "$RUNNER_TEMP/benchmark-report/containers.log" 2>&1 || true
          docker compose logs --no-color --tail 300 > "$RUNNER_TEMP/benchmark-report/compose.log" 2>&1 || true
          # Request-volume tails can hide the first warning that opened a circuit.
          docker compose logs --no-color kong1 kong2 kong3 2>&1 \
            | rg '\[(warn|error|crit|alert|emerg)\]|fallback|unavailable' \
            > "$RUNNER_TEMP/benchmark-report/gateway-errors.log" || true

      - name: Stop benchmark stack
        if: always()
        run: ./run.sh stop 2>&1 | tee "$RUNNER_TEMP/benchmark-report/stop.log"

      - name: Upload reports and raw trials
        id: artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rate-limit-benchmark
          path: ${{ runner.temp }}/benchmark-report/
          if-no-files-found: error
          retention-days: 7

  report:
    name: Publish benchmark in PR conversation
    needs: benchmark
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Separate runner: do not check out or execute PR source with a write token.
      - name: Download report data
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rate-limit-benchmark
          path: ${{ runner.temp }}/benchmark-report

      - name: Create or update PR benchmark comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.benchmark.outputs.artifact_url }}
          RESULT: ${{ needs.benchmark.result }}
          REPORT_DIRECTORY: ${{ runner.temp }}/benchmark-report
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          def api(path, *args):
              result = subprocess.run(['gh', 'api', path, *args], check=True, text=True, capture_output=True)
              return json.loads(result.stdout)

          repository = os.environ['REPOSITORY']
          number = int(os.environ['PR_NUMBER'])
          pr = api(f'repos/{repository}/pulls/{number}')
          # A cancelled/slow older run must not overwrite a newer revision's report.
          if pr['head']['sha'] != os.environ['HEAD_SHA'] or pr['state'] != 'open':
              raise SystemExit(0)
          marker = '<!-- rate-limit-benchmark -->'
          report = Path(os.environ['REPORT_DIRECTORY']) / 'report.md'
          text = report.read_text()[:50000] if report.is_file() else 'No complete report was generated.'
          body = (f"{marker}\nBenchmark run: **{os.environ['RESULT']}**, PR head `{os.environ['HEAD_SHA']}`.\n\n"
                  f"{text}\n\n[Workflow run]({os.environ['RUN_URL']})")
          if os.environ['ARTIFACT_URL']:
              body += f" · [Download report and raw trials]({os.environ['ARTIFACT_URL']})"
          pages = api(f'repos/{repository}/issues/{number}/comments', '--paginate', '--slurp')
          existing = next((c for page in pages for c in page
                           if c['user']['login'] == 'github-actions[bot]' and marker in c['body']), None)
          payload = Path(os.environ['RUNNER_TEMP']) / 'benchmark-comment.json'
          payload.write_text(json.dumps({'body': body}))
          target = (f"repos/{repository}/issues/comments/{existing['id']}" if existing
                    else f'repos/{repository}/issues/{number}/comments')
          api(target, '--method', 'PATCH' if existing else 'POST', '--input', str(payload))
