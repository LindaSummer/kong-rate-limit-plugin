name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Kong and Redis integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kong-srl-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker and Compose
        run: |
          mkdir -p "$RUNNER_TEMP/integration-logs"
          docker version
          docker compose version
          docker compose config --quiet

      - name: Start demo
        run: ./run.sh start 2>&1 | tee "$RUNNER_TEMP/integration-logs/start.log"

      - name: Run integration suite
        run: ./run.sh test 2>&1 | tee "$RUNNER_TEMP/integration-logs/test.log"

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/integration-logs"
          docker compose ps --all > "$RUNNER_TEMP/integration-logs/containers.log" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/integration-logs/compose.log" 2>&1 || true

      - name: Stop demo
        if: always()
        run: ./run.sh stop 2>&1 | tee "$RUNNER_TEMP/integration-logs/stop.log"

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: ${{ runner.temp }}/integration-logs/
          if-no-files-found: warn
          retention-days: 7
